name: Corpus
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Corpus integrity
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every fixture and native proof
        run: python tools/verify_corpus.py
      - name: Test native generation tools
        run: python -m unittest discover -s tools/coverage -p 'test_*.py'
